/* ===== COLOURS, FONTS & EASING ===== */

.plate {

  grid-column: 1;
  grid-row: 1 / 5;

.pa {
  position: relative; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden;

  transition: transform 300ms var(--ease-out), box-shadow 300ms var(--ease-out);
}

      n.a *= .965; cx.beginPath(); cx.arc(n.x, n.y, 8 + n.a * 7, 0, 6.2832);
      cx.fillStyle = n.a > .05 ? `rgba(255,176,153,${.3 + n.a * .7})` : '#1C2028'; cx.fill(); cx.lineWidth = 1.4; cx.strokeStyle = '#30333A'; cx.stroke();
    });
    cx.font = '500 10px JetBrains Mono, monospace'; cx.fillStyle = '#8E9BB0'; cx.textAlign = 'center';
    T.net_layers.forEach((l, i) => cx.fillText(l.toUpperCase(), W * (.12 + .76 * i / (L.length - 1)), H - 12));
    requestAnimationFrame(draw);
  }
  cv.addEventListener('pointermove', e => { const b = cv.getBoundingClientRect(); mx = (e.clientX - b.left) * W / b.width; my = (e.clientY - b.top) * H / b.height; });

  cv.addEventListener('pointercancel', () => { mx = my = -999; });

})();
